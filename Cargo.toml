[package]
name = "libriscv"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.16.1", features = ["derive"] }
libriscv_sys = { version = "0.1.0" }
libriscv-macros = { path = "libriscv-macros" }

[features]
default = []
bindgen = ["libriscv_sys/bindgen"]
binary-translation = ["libriscv_sys/binary-translation"]
